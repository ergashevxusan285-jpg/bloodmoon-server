<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#150e1f">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Bloodmoon Store</title>
<!--
  Bloodmoon Store: dizayn (frontend). Maʼlumotlar serverdan keladi (server.js, PostgreSQL).
-->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#150e1f; --panel:#261a38; --field:#170f22; --line:#3a2a52; --soft:#251936;
  --text:#f3ece7; --muted:#b8adc9; --red:#c8282b; --red-hi:#dc3a3a; --cream:#f3ece7; --ink:#1a1020;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.35;min-height:100vh;padding-bottom:120px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid #ff8a7a;outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}

/* Yuqori qism */
.top{position:sticky;top:0;z-index:20;background:rgba(21,14,31,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--soft);padding:12px 0 14px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.01em;min-width:0;white-space:nowrap}
.dot{width:32px;height:32px;border-radius:50%;flex:none;object-fit:cover}
.btn-main{background:var(--red);color:#fff;font-weight:600;padding:12px 20px;border-radius:999px;white-space:nowrap;max-width:55vw;overflow:hidden;text-overflow:ellipsis}
.btn-main:hover{background:var(--red-hi)}
.search{margin-top:12px;display:flex;align-items:center;gap:12px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:0 16px;height:48px}
.search:focus-within{border-color:#7a5ab0}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px}
.search input::placeholder{color:#9b8fb3}

/* Bosh qism */
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:36px 0 24px}
.hero h1{font-size:clamp(26px,6vw,44px);line-height:1.08;letter-spacing:-.02em;font-weight:700}
.hero p{margin-top:14px;color:var(--muted);font-size:clamp(16px,3.6vw,20px);max-width:30ch}
.orb{flex:none;width:clamp(76px,22vw,150px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7a5c,#d12f2f 48%,#8a1020);box-shadow:0 0 70px rgba(209,47,47,.35)}

/* Filtrlar */
.chips{display:flex;gap:10px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chips+.chips{margin-top:8px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:12px 24px;border-radius:999px;border:1px solid var(--line);font-size:17px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--cream);color:var(--ink);border-color:var(--cream);font-weight:600}
.count{margin:22px 0 16px;color:var(--muted);font-size:17px}

/* Mahsulotlar */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 16px}
@media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
.tile{aspect-ratio:1;border-radius:28px;display:grid;place-items:center;font-size:clamp(44px,14vw,72px)}
.card h3{margin-top:14px;font-size:19px;font-weight:700;overflow-wrap:anywhere}
.meta{color:var(--muted);margin-top:4px}
.price{margin-top:10px;font-weight:700;font-size:19px}
.act{margin-top:12px;width:100%;height:48px;border-radius:999px;background:var(--red);color:#fff;font-weight:600}
.act:hover{background:var(--red-hi)}
.own{display:flex;gap:8px;margin-top:8px}
.own button{flex:1;height:38px;border-radius:999px;border:1px solid var(--line);font-size:15px;color:var(--muted)}
.own button:hover{color:var(--text);border-color:#7a5ab0}
.empty{color:var(--muted);padding:24px 0;font-size:17px}
.empty[hidden]{display:none}

/* Qoʻshish tugmasi */
.fab{position:fixed;right:20px;bottom:24px;width:60px;height:60px;border-radius:50%;background:var(--red);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.45);z-index:30;display:grid;place-items:center}
.fab:hover{background:var(--red-hi)}

/* Xabar */
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,12px);background:var(--cream);color:var(--ink);padding:16px 22px;border-radius:18px;font-weight:600;font-size:18px;text-align:center;max-width:min(300px,calc(100vw - 40px));opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Oynalar */
.ov{position:fixed;inset:0;background:rgba(8,5,14,.8);display:flex;padding:16px;z-index:50;overflow-y:auto}
.ov[hidden]{display:none}
.modal{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:28px;width:100%;max-width:420px;margin:auto}
.modal h2{font-size:30px;font-weight:700;letter-spacing:-.01em;padding-right:36px}
.x{position:absolute;top:18px;right:18px;width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.field{margin-top:20px}
.field[hidden]{display:none}
.field label{display:block;color:var(--muted);margin-bottom:8px;font-size:17px}
.field input,.field select{width:100%;height:56px;background:var(--field);border:1px solid var(--line);border-radius:20px;padding:0 18px;font-size:16px;outline:0}
.field input:focus,.field select:focus{border-color:#7a5ab0}
.field input[type=file]{height:auto;padding:14px 18px}
.field select option{background:#261a38}
.hint{color:var(--muted);font-size:14px;margin-top:6px}
.err{color:#ff9a8f;margin-top:14px}
.submit{margin-top:24px;width:100%;height:60px;border-radius:999px;background:var(--red);color:#fff;font-weight:700;font-size:19px}
.submit:hover{background:var(--red-hi)}
.submit:disabled{opacity:.6}
.or{text-align:center;color:var(--muted);margin:18px 0}
.ghost{width:100%;height:60px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:18px}
.ghost:hover{border-color:#7a5ab0}
.switch{text-align:center;margin-top:22px;color:var(--muted)}
.switch button{color:#ff8f8f;text-decoration:underline;margin-left:6px}

.paysum{margin-top:14px;font-size:18px}
.paybtn{margin-top:14px}

.warn{margin-top:16px;padding:12px 16px;border-radius:16px;background:#3a1f2e;border:1px solid #6a2f45;color:#ffc4b8;font-size:15px}
.warn[hidden]{display:none}

@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

<script>
/* ============ Yordamchi funksiyalar ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0') + '\u00a0soʻm';

let CONFIG = {googleClientId:'', paymentTestMode:true, maxUploadMb:200};

/* ============ Server bilan aloqa (API) ============ */
async function api(path, opts = {}){
  const init = {method: opts.method || 'GET', headers: {}};
  if (opts.json){ init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(opts.json); }
  if (opts.form) init.body = opts.form;
  let res;
  try{ res = await fetch(path, init); }
  catch(e){ throw new Error('Server bilan aloqa yoʻq. Internetni tekshiring.'); }
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if (!res.ok) throw new Error((data && data.error) || 'Xatolik yuz berdi.');
  return data;
}

function productForm(d, file){
  const f = new FormData();
  ['name', 'type', 'platform', 'price', 'emoji'].forEach(k => f.append(k, d[k]));
  if (file) f.append('file', file);
  return f;
}

const API = {
  config:      () => api('/api/config'),
  me:          async () => (await api('/api/me')).user,
  register:    async b => (await api('/api/auth/register', {method:'POST', json:b})).user,
  login:       async b => (await api('/api/auth/login', {method:'POST', json:b})).user,
  googleLogin: async accessToken => (await api('/api/auth/google', {method:'POST', json:{accessToken}})).user,
  logout:      () => api('/api/auth/logout', {method:'POST'}),
  list:        async ({q, type, platform}) => (await api('/api/products?' + new URLSearchParams({q, type, platform}))).products,
  create:      (d, file) => api('/api/products', {method:'POST', form:productForm(d, file)}),
  update:      (id, d, file) => api('/api/products/' + id, {method:'PUT', form:productForm(d, file)}),
  remove:      id => api('/api/products/' + id, {method:'DELETE'}),
  access:      id => api('/api/products/' + id + '/access'),
  pay:         (productId, provider) => api('/api/orders', {method:'POST', json:{productId, provider}})
};

/* ============ Dizayn qismi ============ */
const PALETTE = [
  ['#850018','#c8203a'], ['#1f3a5f','#3f7599'], ['#2e3344','#5a5c7a'], ['#0f4a3c','#1f8a6a'],
  ['#6b4a12','#c08a2a'], ['#3a2370','#6a46b8'], ['#1e3a70','#3566b8'], ['#6a2a3a','#b04a62']
];
const TYPES = {app:'Ilova', game:'Oʻyin', book:'Kitob'};
const PLATS = {android:'Android', pc:'PC', all:''};
const state = {q:'', type:'all', platform:'all', user:null, mode:'login', editId:null, items:[], payId:null};

let toastTimer;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

function showWarn(msg){
  const w = $('#warn');
  w.textContent = msg || ''; w.hidden = !msg;
}

function openModal(sel){
  const el = $(sel); el.hidden = false; document.body.style.overflow = 'hidden';
  const first = el.querySelector('input:not([type=hidden]):not([hidden]), select');
  setTimeout(() => first && first.focus(), 50);
}
function closeModal(sel){
  $(sel).hidden = true;
  if (![...document.querySelectorAll('.ov')].some(o => !o.hidden)) document.body.style.overflow = '';
}

function syncHeader(){
  const b = $('#authBtn');
  b.textContent = state.user ? 'Chiqish (' + state.user.name.split(' ')[0] + ')' : 'Kirish';
}

function gradFor(p){
  return Number.isInteger(p.grad) ? PALETTE[p.grad % PALETTE.length] : PALETTE[p.id % PALETTE.length];
}

function card(p){
  const g = gradFor(p);
  const meta = [TYPES[p.type], PLATS[p.platform]].filter(Boolean).join(', ');
  const free = p.price === 0;
  const canGet = free || p.own || p.paid;
  return `<article class="card">
    <div class="tile" style="background:linear-gradient(160deg,${g[0]},${g[1]})" aria-hidden="true">${esc(p.emoji)}</div>
    <h3>${esc(p.name)}</h3>
    <p class="meta">${esc(meta)}</p>
    <p class="price">${free ? 'Bepul' : p.paid ? 'Sotib olingan' : money(p.price)}</p>
    <button class="act" data-act="${canGet ? 'download' : 'buy'}" data-id="${p.id}">${canGet ? 'Yuklab olish' : 'Sotib olish'}</button>
    ${p.own ? `<div class="own"><button data-act="edit" data-id="${p.id}">Tahrirlash</button><button data-act="del" data-id="${p.id}">Oʻchirish</button></div>` : ''}
  </article>`;
}

let renderToken = 0;
async function render(){
  const t = ++renderToken;
  let items;
  try{ items = await API.list(state); }
  catch(e){ if (t === renderToken){ showWarn(e.message); $('#count').textContent = ''; } return; }
  if (t !== renderToken) return;
  showWarn('');
  state.items = items;
  $('#count').textContent = items.length + ' ta natija';
  $('#grid').innerHTML = items.map(card).join('');
  $('#empty').hidden = items.length > 0;
}

/* Qidiruv va filtrlar */
let searchTimer;
$('#q').addEventListener('input', e => {
  state.q = e.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(render, 250);
});
function chipGroup(sel, attr, key){
  $(sel).addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    state[key] = b.dataset[attr];
    $(sel).querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b ? 'true' : 'false'));
    render();
  });
}
chipGroup('#typeChips', 'type', 'type');
chipGroup('#platChips', 'plat', 'platform');

/* Mahsulot tugmalari */
$('#grid').addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const id = Number(b.dataset.id), act = b.dataset.act;
  if (act === 'buy'){ openPay(id); return; }
  if (act === 'download'){
    try{
      await API.access(id);
      const a = document.createElement('a');
      a.href = '/api/products/' + id + '/download';
      a.download = '';
      document.body.appendChild(a); a.click(); a.remove();
      toast('Yuklab olinmoqda');
    }catch(ex){ toast(ex.message); }
    return;
  }
  if (act === 'edit'){ openProduct(state.items.find(p => p.id === id)); return; }
  if (act === 'del'){
    if (!confirm('Mahsulot oʻchirilsinmi?')) return;
    try{ await API.remove(id); toast('Mahsulot oʻchirildi'); render(); }
    catch(ex){ toast(ex.message); }
  }
});

/* Kirish / roʻyxatdan oʻtish */
function setMode(m){
  state.mode = m;
  const reg = m === 'register';
  $('#aTitle').textContent = reg ? 'Roʻyxatdan oʻtish' : 'Kirish';
  $('#aSubmit').textContent = reg ? 'Roʻyxatdan oʻtish' : 'Kirish';
  $('#aNameBox').hidden = !reg;
  $('#aSwitchText').textContent = reg ? 'Hisobingiz bormi?' : 'Hisobingiz yoʻqmi?';
  $('#aSwitch').textContent = reg ? 'Kirish' : 'Roʻyxatdan oʻtish';
  $('#apass').autocomplete = reg ? 'new-password' : 'current-password';
  $('#aErr').textContent = '';
}
$('#aSwitch').addEventListener('click', () => setMode(state.mode === 'login' ? 'register' : 'login'));

function googleLogin(){
  if (!CONFIG.googleClientId){ toast('Google hali sozlanmagan: serverda GOOGLE_CLIENT_ID kerak'); return; }
  if (!(window.google && google.accounts && google.accounts.oauth2)){ toast('Google yuklanmadi. Internetni tekshiring'); return; }
  const client = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.googleClientId,
    scope: 'openid email profile',
    callback: async r => {
      if (r.error || !r.access_token){ toast('Google orqali kirib boʻlmadi'); return; }
      try{
        state.user = await API.googleLogin(r.access_token);
        closeModal('#aOv'); syncHeader(); render();
        toast('Xush kelibsiz, ' + state.user.name.split(' ')[0]);
      }catch(ex){ toast(ex.message); }
    }
  });
  client.requestAccessToken();
}
$('#gBtn').addEventListener('click', googleLogin);

$('#authBtn').addEventListener('click', async () => {
  if (state.user){
    try{ await API.logout(); }catch(e){}
    state.user = null; syncHeader(); render(); toast('Tizimdan chiqdingiz');
  } else { setMode('login'); openModal('#aOv'); }
});

$('#aForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#aSubmit'); btn.disabled = true; $('#aErr').textContent = '';
  try{
    const email = $('#aemail').value, password = $('#apass').value;
    const reg = state.mode === 'register';
    state.user = reg ? await API.register({name:$('#aname').value, email, password})
                     : await API.login({email, password});
    e.target.reset(); closeModal('#aOv'); syncHeader(); render();
    toast(reg ? 'Hisob ochildi' : 'Xush kelibsiz, ' + state.user.name.split(' ')[0]);
  }catch(ex){ $('#aErr').textContent = ex.message; }
  finally{ btn.disabled = false; }
});

/* Mahsulot qoʻshish / tahrirlash */
$('#fab').addEventListener('click', () => {
  if (!state.user){ toast('Mahsulot qoʻshish uchun avval tizimga kiring'); setMode('login'); openModal('#aOv'); return; }
  openProduct(null);
});

function openProduct(p){
  state.editId = p ? p.id : null;
  $('#pTitle').textContent = p ? 'Mahsulotni tahrirlash' : 'Mahsulot qoʻshish';
  $('#pname').value = p ? p.name : '';
  $('#ptype').value = p ? p.type : 'app';
  $('#pplat').value = p ? p.platform : 'android';
  $('#pprice').value = p ? p.price : 0;
  $('#pemoji').value = p ? p.emoji : '';
  $('#pfile').value = '';
  $('#pFileHint').textContent = p && p.hasFile
    ? 'Hozirgi fayl: ' + p.fileName + '. Yangisini tanlamasangiz, eskisi qoladi.'
    : 'Eng koʻpi ' + CONFIG.maxUploadMb + ' MB.';
  $('#pErr').textContent = '';
  openModal('#pOv');
}

$('#pForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#pSubmit'); $('#pErr').textContent = '';
  const editing = state.editId;
  const data = {name:$('#pname').value, type:$('#ptype').value, platform:$('#pplat').value, price:$('#pprice').value, emoji:$('#pemoji').value};
  const file = $('#pfile').files[0] || null;
  if (file && file.size > CONFIG.maxUploadMb * 1024 * 1024){
    $('#pErr').textContent = 'Fayl juda katta (eng koʻpi ' + CONFIG.maxUploadMb + ' MB).'; return;
  }
  btn.disabled = true; btn.textContent = file ? 'Yuklanmoqda…' : 'Saqlanmoqda…';
  try{
    if (editing) await API.update(editing, data, file); else await API.create(data, file);
    closeModal('#pOv'); render();
    toast(editing ? 'Saqlandi' : 'Mahsulot qoʻshildi');
  }catch(ex){ $('#pErr').textContent = ex.message; }
  finally{ btn.disabled = false; btn.textContent = 'Saqlash'; }
});

/* Toʻlov */
function openPay(id){
  if (!state.user){ toast('Sotib olish uchun avval tizimga kiring'); setMode('login'); openModal('#aOv'); return; }
  const p = state.items.find(p => p.id === id); if (!p) return;
  state.payId = id;
  $('#paySum').innerHTML = '<strong>' + esc(p.name) + '</strong> — ' + money(p.price);
  $('#payNote').textContent = CONFIG.paymentTestMode ? 'Test rejimi: haqiqiy pul yechilmaydi.' : '';
  $('#payErr').textContent = '';
  openModal('#payOv');
}
$('#payOv').addEventListener('click', async e => {
  const b = e.target.closest('[data-pay]'); if (!b) return;
  $('#payErr').textContent = ''; b.disabled = true;
  try{
    await API.pay(state.payId, b.dataset.pay);
    closeModal('#payOv'); render(); toast(CONFIG.paymentTestMode ? 'Toʻlov qabul qilindi (test)' : 'Toʻlov qabul qilindi');
  }catch(ex){ $('#payErr').textContent = ex.message; }
  finally{ b.disabled = false; }
});

/* Oynalarni yopish */
document.querySelectorAll('.ov').forEach(ov => {
  ov.addEventListener('mousedown', e => { if (e.target === ov) closeModal('#' + ov.id); });
  ov.querySelector('[data-close]').addEventListener('click', () => closeModal('#' + ov.id));
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') ['#aOv', '#pOv', '#payOv'].forEach(s => { if (!$(s).hidden) closeModal(s); });
});

/* Boshlash */
(async function init(){
  $('#count').textContent = 'Yuklanmoqda…';
  const slow = setTimeout(() => { $('#count').textContent = 'Server uygʻonmoqda, 1 daqiqagacha kuting…'; }, 6000);
  try{ CONFIG = await API.config(); }
  catch(e){ showWarn('Server bilan aloqa yoʻq. Internetni tekshirib, sahifani yangilang.'); }
  try{ state.user = await API.me(); }catch(e){}
  syncHeader();
  await render();
  clearTimeout(slow);
})();

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
