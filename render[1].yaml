databases:
  - name: bloodmoon-db
    plan: free

services:
  - type: web
    name: bloodmoon-store
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bloodmoon-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_TEST_MODE
        value: "true"
